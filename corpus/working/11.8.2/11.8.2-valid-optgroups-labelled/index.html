<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Boulangerie des Tilleuls</title>
<style>body{margin:0;padding:24px;font-family:sans-serif;color:#1a1a1a;background:#fff}</style>
</head>
<body>
<header><p>Boulangerie des Tilleuls</p></header><main><h1>Commande</h1>
<form action="#">
<p><label for="produit">Produit</label>
<select id="produit" name="produit">
<optgroup label="Pains"><option>Baguette</option><option>Pain de campagne</option></optgroup>
<optgroup label="Viennoiseries"><option>Croissant</option><option>Pain au chocolat</option></optgroup>
</select></p>
<p><label for="retrait">Retrait</label>
<select id="retrait" name="retrait">
<optgroup label="Matin"><option>8 h</option><option>10 h</option></optgroup>
<optgroup label="Après-midi"><option>15 h</option><option>17 h</option></optgroup>
</select></p>
<button type="submit">Commander</button></form></main>
</body>
</html>
