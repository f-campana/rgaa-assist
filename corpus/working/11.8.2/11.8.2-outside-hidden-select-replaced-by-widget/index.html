<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Boulangerie des Tilleuls</title>
<style>body{margin:0;padding:24px;font-family:sans-serif;color:#1a1a1a;background:#fff}.native{display:none}.widget{display:inline-block;border:1px solid #888;padding:4px 8px}</style>
</head>
<body>
<header><p>Boulangerie des Tilleuls</p></header><main><h1>Commande</h1>
<form action="#"><span id="produit-etiquette">Produit</span>
<select class="native" name="produit" aria-labelledby="produit-etiquette">
<optgroup><option>Baguette</option></optgroup>
<optgroup><option>Croissant</option></optgroup>
</select>
<div class="widget" role="listbox" aria-labelledby="produit-etiquette" tabindex="0"><div role="option" aria-selected="true">Baguette</div></div>
<button type="submit">Commander</button></form></main>
</body>
</html>
